<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân - Lê Trọng Hải Đăng</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />

</head>
<body class="locked">
    <audio id="background-music">
        Trình duyệt của bạn không hỗ trợ phát âm thanh.
    </audio>
    
    <main class="neumorphic-card">
        <!-- MOVED: FPS Counter Element -->
        <div id="fps-counter">FPS: 0</div>
        
        <header class="text-center">
             <div class="d-flex justify-content-end mb-3">
                <button id="theme-toggle" class="neumorphic-btn" style="width: 45px; height: 45px; border-radius: 50%;"><i class="fas fa-moon"></i></button>
             </div>
            <img src="logo.jpg" alt="Ảnh đại diện" class="profile-pic" onerror="this.onerror=null;this.src='https://placehold.co/90x90/e0e5ec/79838f?text=Avatar';">
            <h1 class="card-title h4">Lê Trọng Hải Đăng</h1>
            <p id="user-bio" class="my-2">Developer | Freelancer | Yêu thích công nghệ và sáng tạo.</p>
        </header>

        <section class="link-grid my-4">
            <a href="https://www.facebook.com/letronghaidang.limited" target="_blank" class="neumorphic-btn" data-bs-toggle="tooltip" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.tiktok.com/@letronghaidang.limited" target="_blank" class="neumorphic-btn" data-bs-toggle="tooltip" title="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@letronghaidangtool" target="_blank" class="neumorphic-btn" data-bs-toggle="tooltip" title="YouTube"><i class="fab fa-youtube"></i></a>
        </section>

        <section class="neumorphic-player my-3">
            <button id="music-player-btn" class="neumorphic-btn" style="width: 45px; height: 45px; border-radius: 50%;" data-bs-toggle="tooltip" title="Phát nhạc">
                <i id="music-player-icon" class="fas fa-play"></i>
            </button>
            <div class="player-timeline">
                <span id="current-time">00:00</span>
                <div id="progress-bar-container" class="progress-bar-container">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
                <span id="total-duration">00:00</span>
            </div>
            <button id="next-song-btn" class="neumorphic-btn" style="width: 45px; height: 45px; border-radius: 50%;" data-bs-toggle="tooltip" title="Phát ngẫu nhiên">
                <i class="fas fa-shuffle"></i>
            </button>
        </section>

        <section class="banking-info mt-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <p class="mb-0 small">MB BANK</p>
                    <p id="mb-account" class="mb-0 account-number">0222255559999</p>
                </div>
                <button class="neumorphic-btn copy-btn" data-copy-target="#mb-account" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">Copy</button>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <p class="mb-0 small">VÍ MOMO</p>
                    <p id="momo-account" class="mb-0 account-number">0866467353</p>
                </div>
                <button class="neumorphic-btn copy-btn" data-copy-target="#momo-account" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">Copy</button>
            </div>
        </section>
    </main>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script src="music.js"></script>
    <script src="anti.js"></script>
    <script src="lock.js"></script>
</body>
</html>
